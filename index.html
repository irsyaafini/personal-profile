<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ============================================================
         CRITICAL META — SEO + Social
         ============================================================ -->
    <title>Irsya Afini — Researcher · Lifelong Learner</title>
    <meta name="description" content="Personal portfolio website of Irsya Afini — researcher, writer, and lifelong learner. Explore projects, research, and gallery." />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph -->
    <meta property="og:title" content="Irsya Afini — Personal Portfolio" />
    <meta property="og:description" content="Researcher · Lifelong Learner. Explore projects, research, and gallery." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://irsyaafini.netlify.app/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Irsya Afini — Personal Portfolio" />
    <meta name="twitter:description" content="Researcher · Lifelong Learner." />

    <!-- Canonical -->
    <link rel="canonical" href="https://irsyaafini.netlify.app/" />

    <!-- ============================================================
         OPTIMASI LCP — Resource Hints
         GANTI <SUPABASE_PROJECT_ID> dengan ID proyek Supabase Anda.
         Contoh: https://abcdefgh.supabase.co
         ============================================================ -->
    <!-- Preconnect ke Supabase agar handshake TLS dilakukan parallel
         dengan parsing HTML, bukan setelah React mulai fetch data. -->
    <link rel="preconnect" href="https://cfojhttnikuxjhgdtyop.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://cfojhttnikuxjhgdtyop.supabase.co" />

    <!-- Kalau pakai Google Fonts, pakai juga: -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ============================================================
         OPTIMASI: Font dimuat dengan display=swap supaya teks
         tampil dulu pakai fallback, font asli swap-in saat ready.
         GANTI URL fonts di bawah dengan font yang Anda pakai.
         ============================================================ -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,300;1,400&display=swap"
    />

    <!-- ============================================================
         Security headers (Lighthouse Best Practices)
         Sebagian harus juga di-set di server / Netlify _headers.
         ============================================================ -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ============================================================
         Fallback no-script
         ============================================================ -->
    <noscript>
      <div style="padding: 2rem; text-align: center; color: #f5f5f5; background: #0a0a0a;">
        Please enable JavaScript to view this portfolio.
      </div>
    </noscript>
  </body>
</html>
